name: Build Musician Practice Alarm

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the file
        run: cp app/build/outputs/apk/debug/app-debug.apk MusicianPracticeAlarm.apk

      - name: Keep a copy on the run page
        uses: actions/upload-artifact@v4
        with:
          name: MusicianPracticeAlarm
          path: MusicianPracticeAlarm.apk

      - name: Publish a release with a download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Musician Practice Alarm v${{ github.run_number }}
          make_latest: true
          files: MusicianPracticeAlarm.apk
